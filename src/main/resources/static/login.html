<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - MedClinic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container login-box">
        <h2>MedClinic - Acesso ao Sistema</h2>
        <form id="formLogin">
            <label>Usuário</label>
            <input type="text" id="username" required placeholder="admin ou user">

            <label>Senha</label>
            <input type="password" id="password" required placeholder="admin123 ou user123">

            <button type="submit" class="btn" style="width: 100%;">Entrar</button>
            <p id="msgErro" class="erro"></p>
        </form>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (resp.ok) {
                const user = await resp.json();
                window.location.href = (user.role === 'ADMIN') ? '/index.html' : '/listarConsultas.html';
            } else {
                document.getElementById('msgErro').textContent = 'Usuário ou senha inválidos.';
            }
        });
    </script>
</body>
</html>
